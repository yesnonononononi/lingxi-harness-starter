name: harness-example CI

on:
  push:
    branches: [ develop, master ]
    paths:
      - 'harness-example/**'
      - '.github/workflows/harness-example-ci.yml'
  pull_request:
    branches: [ develop, master ]
    paths:
      - 'harness-example/**'
      - '.github/workflows/harness-example-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-example-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 21, Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # harness-example is NOT part of the root reactor, and its internal dependencies
      # (harness-core, lingxi-harness-spring-boot-starter, harness-sandbox-docker, ...) are not
      # published to a remote repository, so install the sibling modules into the local repo first.
      - name: Install sibling modules
        run: ./mvnw -B -ntp -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install

      - name: Build and test harness-example
        # Exclude HarnessExampleApplicationTests (needs a live model); RequireChoiceEndToEndTest
        # self-skips without DEEPSEEK_APIKEY; the remaining tests are plain unit tests.
        run: >
          ./mvnw -B -ntp -f harness-example/pom.xml test
          -Dtest='!HarnessExampleApplicationTests'
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgpg.skip=true

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness-example/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness-example/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
