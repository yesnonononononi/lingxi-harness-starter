server:
  port: 8080
spring:
  application:
    name: harness-example

lingxi:
  agent:
    runtime:
      tool:
        common:
          max-output: 500
        read-file:
          enabled: true
          max-output: 600
        edit-file:
          enabled: true
          max-output: 200
        terminal:
          enabled: true
          timeout: 30
          max-output: 2000
        web-search:
          enabled: true
          baseUrl: https://api.tavily.com/search
          apiKey: ${TAVILY_APIKEY}
          timeout: 30
        context-compact:
          enabled: true

    model:
      conf:
        chat:
          base-url: https://globalai.vip/v1                         #https://openrouter.ai/api/v1/chat/completions  https://api.deepseek.com   http://localhost:1234/v1
          api-key:  ${GLOBALAI_APIKEY}              #DEEPSEEK_APIKEY  #OPENROUTER_APIKEY OPENROUTER_APIKEY
          model-name: "gpt-5.4-mini"                            #"google/gemma-4-12b-qat" "deepseek-v4-flash" "stealth/ox-alpha"
          timeout: 120s
          max-iterations: 50
          max-tokens: 50_0000
        compact:
          base-url: https://globalai.vip/v1                         #https://openrouter.ai/api/v1/chat/completions  https://api.deepseek.com   http://localhost:1234/v1
          api-key: ${GLOBALAI_APIKEY}
          model-name: "gpt-5.4-mini"
          timeout: 120s
          maxTokens: 32768
          reasoning-effort: "none"
          send-thinking: false
          return-thinking: false


