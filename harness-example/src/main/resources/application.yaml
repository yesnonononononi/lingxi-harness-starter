server:
  port: 8080
spring:
  application:
    name: harness-example

lingxi:
  agent:
    # agent 工作环境: local(默认,宿主机) 或 docker(沙箱容器)
    # 选择 docker 时工具的读写/命令全部通过 docker exec 进入容器执行
    workspace: local
    # workspace: docker 时生效
    workspace-docker:
      container-id: my-agent-container
      workspace-root: /workspace
    runtime:
      tool:
        common:
          max-output: 500
        read-file:
          enabled: true
          max-output: 3000
        edit-file:
          enabled: true
          max-output: 200
        terminal:
          enabled: true
          timeout: 30
          max-output: 2000
        web-search:
          enabled: true
          baseUrl: https://api.tavily.com/search
          apiKey: ${TAVILY_APIKEY}
          timeout: 30
        context-compact:
          enabled: true

    model:
      conf:
        chat:
          base-url: https://api.deepseek.com                        #https://openrouter.ai/api/v1/chat/completions     http://localhost:1234/v1 https://globalai.vip/v1
          api-key:  ${DEEPSEEK_APIKEY}              #  #OPENROUTER_APIKEY   GLOBALAI_APIKEY
          model-name: "deepseek-v4-flash"                            #"google/gemma-4-12b-qat" "deepseek-v4-flash" "stealth/ox-alpha"
          timeout: 120s
          max-iterations: 50
          max-tokens: 393200
          reasoning-effort: medium
        compact:
          base-url: https://globalai.vip/v1                         #https://openrouter.ai/api/v1/chat/completions  https://api.deepseek.com   http://localhost:1234/v1
          api-key: ${GLOBALAI_APIKEY}
          model-name: "deepseek-v4-flash"
          timeout: 120s
          maxTokens: 32768
          reasoning-effort: "none"
          send-thinking: false
          return-thinking: false


